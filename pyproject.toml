[project]
name = "zero-avsr"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bitsandbytes>=0.47.0",
    "editdistance>=0.8.1",
    "einops>=0.8.1",
    "fairseq>=0.12.2",
    "huggingface-hub[cli]>=0.35.3",
    "hydra-core==1.0.7",
    "librosa>=0.11.0",
    "numpy==1.23.5",
    "omegaconf==2.0.6",
    "opencv-python>=4.8.1.78",
    "pandas>=2.1.0",
    "peft>=0.17.1",
    "python-speech-features>=0.6",
    "scipy>=1.15.3",
    "sentencepiece>=0.2.1",
    "soundfile>=0.13.1",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.4",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "transformers>=4.56.2",
    "unidecode>=1.4.0",
]

[tool.uv.sources]
fairseq = { path = "./fairseq", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
